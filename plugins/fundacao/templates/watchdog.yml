name: Watchdog

# Template. Copie para .github/workflows/ do departamento.
#
# Vigilância independente, deliberadamente FORA do ecossistema Claude — não
# compartilha modo de falha com ele. Não usa modelo, não usa chave de API, não
# usa Action de terceiro: só GitHub e bash com o GITHUB_TOKEN nativo.
#
# Canal de alerta: a falha do job. O GitHub notifica o dono por e-mail quando um
# workflow agendado falha.
#
# Ajuste antes de usar: MEMORY_GLOB, se o departamento tiver executores com
# memory: project. Uma versão ativa e testada deste arquivo está em
# .github/workflows/watchdog.yml do repositório público.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  MEMORY_GLOB: '.claude/agent-memory/*/MEMORY.md'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PRs claude/* parados há mais de 7 dias
        id: stale_prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AGORA=$(date -u +%s)
          ACHADOS=0

          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,headRefName,updatedAt --limit 100 > prs.json

          while read -r linha; do
            [ -z "$linha" ] && continue
            NUM=$(printf '%s' "$linha" | jq -r '.number')
            REF=$(printf '%s' "$linha" | jq -r '.headRefName')
            UPD=$(printf '%s' "$linha" | jq -r '.updatedAt')
            DIAS=$(( (AGORA - $(date -u -d "$UPD" +%s)) / 86400 ))
            if [ "$DIAS" -gt 7 ]; then
              echo "::warning::PR #$NUM ($REF) parado há $DIAS dias"
              ACHADOS=$((ACHADOS + 1))
            fi
          done < <(jq -c '.[] | select(.headRefName | startswith("claude/"))' prs.json)

          echo "achados=$ACHADOS" >> "$GITHUB_OUTPUT"

      - name: Telemetria — rotina morta há mais de 26h
        id: dead_routine
        run: |
          set -euo pipefail
          ARQ="telemetry/runs.jsonl"

          if [ ! -f "$ARQ" ]; then
            echo "Sem $ARQ — verificação não aplicável."
            echo "achados=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ULTIMO=$(tail -1 "$ARQ" | jq -r '.ts')
          HORAS=$(( ($(date -u +%s) - $(date -u -d "$ULTIMO" +%s)) / 3600 ))
          if [ "$HORAS" -gt 26 ]; then
            echo "::warning::Nenhum registro de run há $HORAS horas — rotina possivelmente morta"
            echo "achados=1" >> "$GITHUB_OUTPUT"
          else
            echo "achados=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Memória de executor acima do limite
        id: memory_limit
        run: |
          set -euo pipefail
          ACHADOS=0

          # Limites do blueprint: 200 linhas ou 25KB. Excedente é descartado
          # SILENCIOSAMENTE pelo runtime — por isso precisa de vigia externo.
          for ARQ in $MEMORY_GLOB; do
            [ -f "$ARQ" ] || continue
            LINHAS=$(wc -l < "$ARQ")
            BYTES=$(wc -c < "$ARQ")
            if [ "$LINHAS" -gt 200 ] || [ "$BYTES" -gt 25600 ]; then
              echo "::warning::$ARQ com $LINHAS linhas / $BYTES bytes — acima do limite; conteúdo excedente está sendo descartado sem aviso"
              ACHADOS=$((ACHADOS + 1))
            fi
          done

          echo "achados=$ACHADOS" >> "$GITHUB_OUTPUT"

      - name: Veredito
        run: |
          set -euo pipefail
          TOTAL=$(( ${{ steps.stale_prs.outputs.achados }} \
                  + ${{ steps.dead_routine.outputs.achados }} \
                  + ${{ steps.memory_limit.outputs.achados }} ))

          if [ "$TOTAL" -gt 0 ]; then
            echo "Watchdog: $TOTAL achado(s). Detalhes nos warnings acima."
            exit 1
          fi

          echo "Watchdog: nada a reportar."
