name: Watchdog

# Vigilância independente, deliberadamente FORA do ecossistema Claude — não
# compartilha modo de falha com aquilo que vigia. Sem modelo, sem chave de API,
# sem Action de terceiro: só GitHub e bash com o GITHUB_TOKEN nativo.
#
# Canal de alerta: a falha do job. O GitHub notifica o dono por e-mail quando um
# workflow agendado falha — sem integração, sem segredo, sem custo.
#
# PORTÁVEL ENTRE RUNNERS ubuntu-latest HOSPEDADOS PELO GITHUB: os quatro checks
# pulam sozinhos quando não se aplicam ao repositório. Copiar este arquivo para
# .github/workflows/ de outro departamento basta e não há nada para ajustar —
# desde que o runner seja `ubuntu-latest` do GitHub. É por isso que não existe
# uma segunda cópia "template" no plugin — duas cópias divergem, uma não.
#
# A promessa acima NÃO se estende a runner self-hosted enxuto nem a macOS/BSD.
# Os steps dependem de três coisas que a imagem do GitHub já traz e que nenhum
# outro ambiente garante: `gh` (GitHub CLI), `jq`, e o `date` do GNU coreutils
# na sintaxe `date -u -d "<timestamp>"` — o `date` do BSD/macOS rejeita `-d` e o
# job quebra na primeira conversão de data. Em runner assim, instale as três
# dependências antes de usar. O job não foi reescrito para ser portável a elas
# de propósito: o que estava errado era a promessa, não o código.
#
# CHECKOUT RASO E REFS REMOTAS: `actions/checkout` sem `fetch-depth` traz apenas
# a ref do evento, então nenhuma `origin/claude/*` existe no clone e o check de
# branch órfã lia uma lista sempre vazia — passava por não enxergar nada, não
# por não haver nada. Verificado em 2026-08-20 reproduzindo o fetch do
# checkout@v4: com duas branches `claude/*` no remoto, `git branch -r` devolveu
# só `origin/main`. Corrigido com um fetch dirigido `--depth=1` das refs
# `claude/*` dentro do próprio step. Escolhido por ser o mais barato que
# funciona: mantém o clone raso, traz só a ponta de cada branch `claude/*` e
# preserva o `git log -1 origin/<branch>` que o step usa para medir idade. As
# alternativas custam mais — `fetch-depth: 0` clona todo o histórico a cada
# execução diária, e consultar o remoto via `gh api` exigiria uma chamada extra
# por branch para obter a data do commit. Custo do caminho escolhido: uma
# chamada de rede a mais por execução.
#
# ---------------------------------------------------------------------------
# O QUE ESTE WORKFLOW *NÃO* COBRE — leia antes de tratar o verde como garantia
# ---------------------------------------------------------------------------
# - Não lê conteúdo. Detecta sinais de abandono (PR parado, branch órfã, rotina
#   sem registro, memória estourada), nunca se o trabalho está certo.
# - Não avalia valor. Uma rotina que registra run toda semana e não produz nada
#   útil passa neste check — o sunset da seção 6 do blueprint é decisão humana.
# - Não vê rotina de repositório sem telemetry/runs.jsonl. O check pula, e pular
#   não é aprovar: é ausência de sinal.
# - Não substitui a rotina semanal de conformidade N2, que é quem olha o
#   conteúdo publicado.
# - Não verifica secret scanning, ruleset de branch nem proteção de main. Esses
#   são configuração de repositório e não aparecem aqui.

# CADÊNCIA: semanal, não diária. Mudado em 2026-08-21, com o custo declarado.
#
# O watchdog existe para detectar quando a automação PARA. Rodando semanal, a
# latência de detecção passa a ser de até sete dias — isso é uma perda real, não
# um detalhe, e está escrito aqui para quem for mexer depois saber o que está
# trocando. A troca se justifica para um operador solo: descobrir na segunda que
# algo parou na quarta é aceitável; pagar execução diária em cada repositório
# privado do ecossistema, não.
#
# Segunda 08:00 UTC, quatro horas depois do backup (04:17), para os dois não
# disputarem a fila de agendamento do GitHub — que atrasa no topo da hora.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PRs claude/* parados há mais de 7 dias
        id: stale_prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AGORA=$(date -u +%s)
          ACHADOS=0

          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,headRefName,updatedAt --limit 100 > prs.json

          while read -r linha; do
            [ -z "$linha" ] && continue
            NUM=$(printf '%s' "$linha" | jq -r '.number')
            REF=$(printf '%s' "$linha" | jq -r '.headRefName')
            UPD=$(printf '%s' "$linha" | jq -r '.updatedAt')
            TITULO=$(printf '%s' "$linha" | jq -r '.title')
            DIAS=$(( (AGORA - $(date -u -d "$UPD" +%s)) / 86400 ))
            if [ "$DIAS" -gt 7 ]; then
              echo "::warning::PR #$NUM ($REF) parado há $DIAS dias — $TITULO"
              ACHADOS=$((ACHADOS + 1))
            fi
          done < <(jq -c '.[] | select(.headRefName | startswith("claude/"))' prs.json)

          echo "achados=$ACHADOS" >> "$GITHUB_OUTPUT"

      - name: Branches claude/* sem PR aberto
        id: orphan_branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACHADOS=0

          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json headRefName --limit 100 | jq -r '.[].headRefName' | sort -u > com_pr.txt

          # Sem este fetch a lista abaixo sai sempre vazia: o Checkout é raso e
          # traz só a ref do evento, então não há nenhuma origin/claude/* no
          # clone. --depth=1 traz apenas a ponta de cada branch, que é tudo que
          # o `git log -1` adiante precisa. O `|| true` é obrigatório: quando
          # não existe nenhuma branch claude/* no remoto o fetch sai com código
          # 1 e, sob `set -e`, derrubaria o job — como a falha do job É o canal
          # de alerta, isso viraria alarme falso diário.
          git fetch --no-tags --depth=1 origin \
            '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true

          git branch -r --format='%(refname:short)' \
            | sed 's|^origin/||' | grep '^claude/' | sort -u > todas.txt || true

          while read -r BR; do
            [ -z "$BR" ] && continue
            if ! grep -qxF "$BR" com_pr.txt; then
              ULTIMO=$(git log -1 --format=%ct "origin/$BR" 2>/dev/null || echo 0)
              DIAS=$(( ($(date -u +%s) - ULTIMO) / 86400 ))
              if [ "$DIAS" -gt 7 ]; then
                echo "::warning::Branch $BR sem PR aberto, último commit há $DIAS dias — trabalho possivelmente órfão"
                ACHADOS=$((ACHADOS + 1))
              fi
            fi
          done < todas.txt

          echo "achados=$ACHADOS" >> "$GITHUB_OUTPUT"

      - name: Telemetria — rotina morta há mais de 26h
        id: dead_routine
        run: |
          set -euo pipefail
          ARQ="telemetry/runs.jsonl"

          if [ ! -f "$ARQ" ]; then
            echo "Sem $ARQ neste repositório — verificação não aplicável (ausência de sinal, não aprovação)."
            echo "achados=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ULTIMO=$(tail -1 "$ARQ" | jq -r '.ts')
          HORAS=$(( ($(date -u +%s) - $(date -u -d "$ULTIMO" +%s)) / 3600 ))
          if [ "$HORAS" -gt 26 ]; then
            echo "::warning::Nenhum registro de run há $HORAS horas — rotina possivelmente morta"
            echo "achados=1" >> "$GITHUB_OUTPUT"
          else
            echo "achados=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Memória de executor acima do limite
        id: memory_limit
        run: |
          set -euo pipefail
          ACHADOS=0
          ENCONTROU=0

          # Limites do blueprint: 200 linhas ou 25KB. O excedente é descartado
          # SILENCIOSAMENTE pelo runtime — por isso precisa de vigia externo.
          for ARQ in .claude/agent-memory/*/MEMORY.md; do
            [ -f "$ARQ" ] || continue
            ENCONTROU=1
            LINHAS=$(wc -l < "$ARQ")
            BYTES=$(wc -c < "$ARQ")
            if [ "$LINHAS" -gt 200 ] || [ "$BYTES" -gt 25600 ]; then
              echo "::warning::$ARQ com $LINHAS linhas / $BYTES bytes — acima do limite; o excedente está sendo descartado sem aviso"
              ACHADOS=$((ACHADOS + 1))
            fi
          done

          [ "$ENCONTROU" -eq 0 ] && echo "Sem memória de executor neste repositório — verificação não aplicável."
          echo "achados=$ACHADOS" >> "$GITHUB_OUTPUT"

      - name: Veredito
        run: |
          set -euo pipefail
          TOTAL=$(( ${{ steps.stale_prs.outputs.achados }} \
                  + ${{ steps.orphan_branches.outputs.achados }} \
                  + ${{ steps.dead_routine.outputs.achados }} \
                  + ${{ steps.memory_limit.outputs.achados }} ))

          if [ "$TOTAL" -gt 0 ]; then
            echo "Watchdog: $TOTAL achado(s). Detalhes nos warnings acima."
            echo "A falha deste job É o alerta — o GitHub notifica o dono por e-mail."
            exit 1
          fi

          echo "Watchdog: nada a reportar."
